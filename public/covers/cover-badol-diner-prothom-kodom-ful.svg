<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-34" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211a0c" />
      <stop offset="50%" stop-color="#332813" />
      <stop offset="100%" stop-color="#110d06" />
    </linearGradient>
    <filter id="glow-34" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="800" fill="url(#bg-34)" />

  <!-- Cohesive Collection Borders -->
  <rect x="24" y="24" width="552" height="752" rx="4" fill="none" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.3" />
  <rect x="32" y="32" width="536" height="736" rx="2" fill="none" stroke="#facc15" stroke-width="2.5" stroke-opacity="0.8" />
  <rect x="38" y="38" width="524" height="724" fill="none" stroke="#facc15" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.5" />

  <!-- Corner Brackets -->
  <path d="M 24 44 L 44 44 L 44 24" fill="none" stroke="#facc15" stroke-width="3" />
  <path d="M 576 44 L 556 44 L 556 24" fill="none" stroke="#facc15" stroke-width="3" />
  <path d="M 24 756 L 44 756 L 44 776" fill="none" stroke="#facc15" stroke-width="3" />
  <path d="M 576 756 L 556 756 L 556 776" fill="none" stroke="#facc15" stroke-width="3" />

  <!-- Header Branding -->
  <text x="300" y="80" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Serif Bengali', 'Georgia', serif" font-size="14" letter-spacing="4" fill="#facc15" font-weight="600" opacity="0.9">
    কথাবার্তা সাহিত্য সংকলন
  </text>
  <line x1="160" y1="95" x2="440" y2="95" stroke="#facc15" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="300" cy="95" r="3.5" fill="#facc15" />

  <!-- Serial Number Pill -->
  <rect x="230" y="112" width="140" height="24" rx="12" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1" stroke-opacity="0.5" />
  <text x="300" y="128" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold" letter-spacing="1">
    সংকলন নং ৩৪
  </text>

  <!-- Central Artwork Vignette -->
  <g transform="translate(300, 310)" filter="url(#glow-34)">
    <circle cx="0" cy="0" r="110" fill="#facc15" fill-opacity="0.06" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.25" />
    <circle cx="0" cy="0" r="85" fill="#facc15" fill-opacity="0.08" stroke="#facc15" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4" />
    
        <!-- Spherical Kadam flower with radiating stamens -->
        <circle cx="0" cy="0" r="28" fill="#facc15" />
        <g stroke="#facc15" stroke-width="1.5">
            <line x1="0" y1="-28" x2="0" y2="-45" />
            <line x1="0" y1="28" x2="0" y2="45" />
            <line x1="-28" y1="0" x2="-45" y2="0" />
            <line x1="28" y1="0" x2="45" y2="0" />
            <line x1="-20" y1="-20" x2="-35" y2="-35" />
            <line x1="20" y1="-20" x2="35" y2="-35" />
            <line x1="-20" y1="20" x2="-35" y2="35" />
            <line x1="20" y1="20" x2="35" y2="35" />
        </g>
        <circle cx="0" cy="0" r="14" fill="#ffffff" fill-opacity="0.9" />
        
  </g>

  <!-- Title & Subtitle Area -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Serif Bengali', 'SolaimanLipi', serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      বাদল দিনের প্রথম কদম ফুল
    </text>
    <line x1="-120" y1="26" x2="120" y2="26" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.6" />
    <polygon points="0,21 6,26 0,31 -6,26" fill="#facc15" />
    <text x="0" y="56" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-size="15" fill="#cbd5e1" font-weight="500">
      প্রথম কদমের মিষ্টি সুবাস
    </text>
  </g>

  <!-- Footer Seal -->
  <g transform="translate(300, 705)">
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#facc15" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="-90" cy="0" r="2.5" fill="#facc15" />
    <circle cx="90" cy="0" r="2.5" fill="#facc15" />
    <rect x="-42" y="-12" width="84" height="24" rx="4" fill="#211a0c" stroke="#facc15" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="4" text-anchor="middle" font-family="'Hind Siliguri', serif" font-size="11" font-weight="700" fill="#facc15" letter-spacing="2">
      কথা বার্তা
    </text>
    <text x="0" y="26" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8" letter-spacing="1">
      LITERARY HERITAGE • COLLECTION
    </text>
  </g>
</svg>