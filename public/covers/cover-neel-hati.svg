<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-90" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1b33" />
      <stop offset="50%" stop-color="#12284d" />
      <stop offset="100%" stop-color="#050c19" />
    </linearGradient>
    <filter id="glow-90" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="800" fill="url(#bg-90)" />

  <!-- Cohesive Collection Borders -->
  <rect x="24" y="24" width="552" height="752" rx="4" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-opacity="0.3" />
  <rect x="32" y="32" width="536" height="736" rx="2" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-opacity="0.8" />
  <rect x="38" y="38" width="524" height="724" fill="none" stroke="#bae6fd" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.5" />

  <!-- Corner Brackets -->
  <path d="M 24 44 L 44 44 L 44 24" fill="none" stroke="#bae6fd" stroke-width="3" />
  <path d="M 576 44 L 556 44 L 556 24" fill="none" stroke="#bae6fd" stroke-width="3" />
  <path d="M 24 756 L 44 756 L 44 776" fill="none" stroke="#bae6fd" stroke-width="3" />
  <path d="M 576 756 L 556 756 L 556 776" fill="none" stroke="#bae6fd" stroke-width="3" />

  <!-- Header Branding -->
  <text x="300" y="80" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Serif Bengali', 'Georgia', serif" font-size="14" letter-spacing="4" fill="#bae6fd" font-weight="600" opacity="0.9">
    কথাবার্তা সাহিত্য সংকলন
  </text>
  <line x1="160" y1="95" x2="440" y2="95" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="300" cy="95" r="3.5" fill="#bae6fd" />

  <!-- Serial Number Pill -->
  <rect x="230" y="112" width="140" height="24" rx="12" fill="#bae6fd" fill-opacity="0.15" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.5" />
  <text x="300" y="128" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold" letter-spacing="1">
    সংকলন নং ৯০
  </text>

  <!-- Central Artwork Vignette -->
  <g transform="translate(300, 310)" filter="url(#glow-90)">
    <circle cx="0" cy="0" r="110" fill="#bae6fd" fill-opacity="0.06" stroke="#bae6fd" stroke-width="1.5" stroke-opacity="0.25" />
    <circle cx="0" cy="0" r="85" fill="#bae6fd" fill-opacity="0.08" stroke="#bae6fd" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4" />
    
        <!-- Royal Blue Elephant silhouette -->
        <circle cx="-15" cy="-10" r="28" fill="#bae6fd" />
        <ellipse cx="15" cy="5" rx="32" ry="24" fill="#bae6fd" />
        <!-- Trunk -->
        <path d="M -38 -15 Q -55 0 -45 25" fill="none" stroke="#bae6fd" stroke-width="5" />
        <!-- Golden Haudah arch -->
        <polygon points="10,-25 25,-40 5,-40" fill="#ffffff" />
        
  </g>

  <!-- Title & Subtitle Area -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Serif Bengali', 'SolaimanLipi', serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      নীল হাতি
    </text>
    <line x1="-120" y1="26" x2="120" y2="26" stroke="#bae6fd" stroke-width="1.5" stroke-opacity="0.6" />
    <polygon points="0,21 6,26 0,31 -6,26" fill="#bae6fd" />
    <text x="0" y="56" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-size="15" fill="#cbd5e1" font-weight="500">
      নীল হাতির দেশে রোমাঞ্চকর রূপকথা
    </text>
  </g>

  <!-- Footer Seal -->
  <g transform="translate(300, 705)">
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="-90" cy="0" r="2.5" fill="#bae6fd" />
    <circle cx="90" cy="0" r="2.5" fill="#bae6fd" />
    <rect x="-42" y="-12" width="84" height="24" rx="4" fill="#0c1b33" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="4" text-anchor="middle" font-family="'Hind Siliguri', serif" font-size="11" font-weight="700" fill="#bae6fd" letter-spacing="2">
      কথা বার্তা
    </text>
    <text x="0" y="26" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8" letter-spacing="1">
      LITERARY HERITAGE • COLLECTION
    </text>
  </g>
</svg>